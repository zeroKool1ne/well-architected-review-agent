<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="820" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">Well-Architected Review Agent</text>
  <text x="40" y="72" font-size="15" fill="#475569">An architecture diagram goes in, pillar findings come out — with a human confirmation gate in the middle</text>

  <!-- Phase labels -->
  <text x="40" y="118" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1.2">PHASE 1 — EXTRACT (AI)</text>
  <text x="505" y="118" font-size="12" font-weight="700" fill="#b45309" letter-spacing="1.2">HUMAN GATE</text>
  <text x="737" y="118" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1.2">PHASE 2 — REVIEW (AI)</text>

  <!-- ===== Row 1: flow boxes ===== -->

  <rect x="40" y="132" width="190" height="104" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="135" y="162" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">1. Upload</text>
  <text x="135" y="186" font-size="12.5" fill="#475569" text-anchor="middle">User uploads an AWS</text>
  <text x="135" y="204" font-size="12.5" fill="#475569" text-anchor="middle">architecture diagram</text>
  <text x="135" y="222" font-size="12.5" fill="#475569" text-anchor="middle">as an image</text>

  <rect x="272" y="132" width="190" height="104" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="367" y="162" font-size="15" font-weight="700" fill="#0c4a6e" text-anchor="middle">2. Extraction Agent</text>
  <text x="367" y="186" font-size="12.5" fill="#075985" text-anchor="middle">Vision model turns the</text>
  <text x="367" y="204" font-size="12.5" fill="#075985" text-anchor="middle">image into a graph of</text>
  <text x="367" y="222" font-size="12.5" fill="#075985" text-anchor="middle">services and links</text>

  <rect x="505" y="132" width="190" height="104" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="600" y="162" font-size="15" font-weight="700" fill="#78350f" text-anchor="middle">3. Human confirms</text>
  <text x="600" y="186" font-size="12.5" fill="#78350f" text-anchor="middle">Reviewer corrects the</text>
  <text x="600" y="204" font-size="12.5" fill="#78350f" text-anchor="middle">graph. Nothing is</text>
  <text x="600" y="222" font-size="12.5" fill="#78350f" text-anchor="middle">reviewed before this.</text>

  <rect x="737" y="132" width="190" height="104" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="832" y="162" font-size="15" font-weight="700" fill="#0c4a6e" text-anchor="middle">4. Pillar Agents ×3</text>
  <text x="832" y="186" font-size="12.5" fill="#075985" text-anchor="middle">Specialists run in</text>
  <text x="832" y="204" font-size="12.5" fill="#075985" text-anchor="middle">parallel, each over its</text>
  <text x="832" y="222" font-size="12.5" fill="#075985" text-anchor="middle">own slice of the corpus</text>

  <rect x="970" y="132" width="190" height="104" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1065" y="162" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">5. Findings</text>
  <text x="1065" y="186" font-size="12.5" fill="#475569" text-anchor="middle">Merged and ranked</text>
  <text x="1065" y="204" font-size="12.5" fill="#475569" text-anchor="middle">by the supervisor,</text>
  <text x="1065" y="222" font-size="12.5" fill="#475569" text-anchor="middle">each one cited</text>

  <line x1="232" y1="184" x2="268" y2="184" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="464" y1="184" x2="501" y2="184" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <line x1="697" y1="184" x2="733" y2="184" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <line x1="929" y1="184" x2="966" y2="184" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Row 2: AWS services ===== -->
  <text x="40" y="282" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1.2">AWS SERVICES BEHIND EACH STEP</text>

  <rect x="40" y="296" width="190" height="88" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="135" y="320" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">S3 + CloudFront</text>
  <text x="135" y="342" font-size="11.5" fill="#64748b" text-anchor="middle">Static frontend,</text>
  <text x="135" y="358" font-size="11.5" fill="#64748b" text-anchor="middle">presigned upload —</text>
  <text x="135" y="374" font-size="11.5" fill="#64748b" text-anchor="middle">no public bucket</text>

  <rect x="272" y="296" width="190" height="88" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="367" y="320" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">Bedrock (Nova Lite)</text>
  <text x="367" y="342" font-size="11.5" fill="#64748b" text-anchor="middle">Called from Lambda</text>
  <text x="367" y="358" font-size="11.5" fill="#64748b" text-anchor="middle">via an IAM role —</text>
  <text x="367" y="374" font-size="11.5" fill="#64748b" text-anchor="middle">no API key anywhere</text>

  <rect x="505" y="296" width="190" height="88" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="600" y="320" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="middle">DynamoDB + SQS</text>
  <text x="600" y="342" font-size="11.5" fill="#92400e" text-anchor="middle">Pending graphs wait</text>
  <text x="600" y="358" font-size="11.5" fill="#92400e" text-anchor="middle">in a queue, decoupled</text>
  <text x="600" y="374" font-size="11.5" fill="#92400e" text-anchor="middle">from the request</text>

  <rect x="737" y="296" width="190" height="88" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="832" y="320" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">Chroma index in S3</text>
  <text x="832" y="342" font-size="11.5" fill="#64748b" text-anchor="middle">Vector search, filtered</text>
  <text x="832" y="358" font-size="11.5" fill="#64748b" text-anchor="middle">per pillar via chunk</text>
  <text x="832" y="374" font-size="11.5" fill="#64748b" text-anchor="middle">metadata</text>

  <rect x="970" y="296" width="190" height="88" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1065" y="320" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">Lambda + CloudWatch</text>
  <text x="1065" y="342" font-size="11.5" fill="#64748b" text-anchor="middle">FastAPI in a container,</text>
  <text x="1065" y="358" font-size="11.5" fill="#64748b" text-anchor="middle">arm64, behind a</text>
  <text x="1065" y="374" font-size="11.5" fill="#64748b" text-anchor="middle">Function URL</text>

  <line x1="135" y1="240" x2="135" y2="292" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="367" y1="240" x2="367" y2="292" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="600" y1="240" x2="600" y2="292" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="832" y1="240" x2="832" y2="292" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="1065" y1="240" x2="1065" y2="292" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- ===== Two endpoints band ===== -->
  <text x="40" y="432" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1.2">THE GATE IS A REQUEST BOUNDARY — STATE LIVES IN DYNAMODB, NOT IN THE FRAMEWORK</text>
  <rect x="40" y="446" width="1120" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="62" y="462" width="330" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="227" y="480" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">POST /extract</text>
  <text x="227" y="496" font-size="11" fill="#64748b" text-anchor="middle">writes the graph as status: pending</text>

  <rect x="412" y="462" width="330" height="42" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="577" y="480" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">human edits in the review UI</text>
  <text x="577" y="496" font-size="11" fill="#92400e" text-anchor="middle">status: confirmed</text>

  <rect x="762" y="462" width="376" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="950" y="480" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">POST /review</text>
  <text x="950" y="496" font-size="11" fill="#64748b" text-anchor="middle">refuses to run unless the graph is confirmed</text>

  <line x1="394" y1="483" x2="408" y2="483" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="744" y1="483" x2="758" y2="483" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Why the gate exists ===== -->
  <rect x="40" y="552" width="552" height="228" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="64" y="582" font-size="14" font-weight="700" fill="#78350f">Why the human gate is there — measured, not assumed</text>

  <text x="64" y="612" font-size="12.5" fill="#78350f">Spike on 6 Oct, Nova Lite on a real 1924×1959 px diagram:</text>

  <circle cx="72" cy="634" r="3.5" fill="#15803d"/>
  <text x="86" y="638" font-size="12.5" fill="#166534" font-weight="700">OCR: excellent.</text>
  <text x="196" y="638" font-size="12.5" fill="#78350f">All 21 boxes read correctly.</text>

  <circle cx="72" cy="660" r="3.5" fill="#b91c1c"/>
  <text x="86" y="664" font-size="12.5" fill="#991b1b" font-weight="700">Connections: hallucinated.</text>
  <text x="258" y="664" font-size="12.5" fill="#78350f">It chained the boxes</text>
  <text x="86" y="681" font-size="12.5" fill="#78350f">linearly — edges that are not in the image at all.</text>

  <circle cx="72" cy="703" r="3.5" fill="#b91c1c"/>
  <text x="86" y="707" font-size="12.5" fill="#991b1b" font-weight="700">Self-reported confidence: useless.</text>
  <text x="314" y="707" font-size="12.5" fill="#78350f">0.95 everywhere,</text>
  <text x="86" y="724" font-size="12.5" fill="#78350f">zero unreadable regions flagged. Confidently wrong.</text>

  <text x="64" y="754" font-size="12.5" fill="#78350f" font-weight="700">So the human sits where the model is provably weak —</text>
  <text x="64" y="771" font-size="12.5" fill="#78350f" font-weight="700">not as a rubber stamp at the end.</text>

  <!-- ===== Evaluation box ===== -->
  <rect x="608" y="552" width="552" height="228" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="632" y="582" font-size="14" font-weight="700" fill="#0f172a">How it gets tested</text>

  <text x="632" y="610" font-size="12.5" font-weight="700" fill="#334155">AI side (LangSmith) — two baselines</text>
  <text x="632" y="630" font-size="12.5" fill="#475569">B1: naive single pass, no gate. B2: one generalist</text>
  <text x="632" y="648" font-size="12.5" fill="#475569">agent instead of pillar specialists. Measured on:</text>
  <text x="632" y="666" font-size="12.5" fill="#475569">graph accuracy, hallucinated-edge rate, context</text>
  <text x="632" y="684" font-size="12.5" fill="#475569">relevancy, citation groundedness, latency, cost.</text>

  <text x="632" y="714" font-size="12.5" font-weight="700" fill="#334155">AWS side</text>
  <text x="632" y="734" font-size="12.5" fill="#475569">pytest + moto for mocked AWS calls, IAM policy</text>
  <text x="632" y="752" font-size="12.5" fill="#475569">simulation for least privilege, and a smoke test</text>
  <text x="632" y="770" font-size="12.5" fill="#475569">run against the deployed endpoint.</text>
</svg>

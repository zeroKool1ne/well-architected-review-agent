<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="27" font-weight="700" fill="#0f172a">How a review runs</text>
  <text x="40" y="76" font-size="16" fill="#475569">A diagram goes in, findings come out — with a human confirming the reading in between</text>

  <!-- ===== Flow ===== -->
  <text x="40" y="128" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1.2">PHASE 1 — EXTRACT</text>
  <text x="470" y="128" font-size="12" font-weight="700" fill="#b45309" letter-spacing="1.2">HUMAN GATE</text>
  <text x="700" y="128" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1.2">PHASE 2 — REVIEW</text>

  <rect x="40" y="144" width="186" height="96" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="133" y="178" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Upload</text>
  <text x="133" y="203" font-size="13.5" fill="#475569" text-anchor="middle">An architecture</text>
  <text x="133" y="221" font-size="13.5" fill="#475569" text-anchor="middle">diagram as an image</text>

  <rect x="262" y="144" width="186" height="96" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="355" y="178" font-size="16" font-weight="700" fill="#0c4a6e" text-anchor="middle">Extraction Agent</text>
  <text x="355" y="203" font-size="13.5" fill="#075985" text-anchor="middle">Boxes first,</text>
  <text x="355" y="221" font-size="13.5" fill="#075985" text-anchor="middle">then arrows</text>

  <rect x="484" y="144" width="186" height="96" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="577" y="178" font-size="16" font-weight="700" fill="#78350f" text-anchor="middle">Human confirms</text>
  <text x="577" y="203" font-size="13.5" fill="#78350f" text-anchor="middle">Corrects the graph.</text>
  <text x="577" y="221" font-size="13.5" fill="#78350f" text-anchor="middle">Nothing runs before.</text>

  <rect x="706" y="144" width="186" height="96" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="799" y="178" font-size="16" font-weight="700" fill="#0c4a6e" text-anchor="middle">Pillar Agents ×3</text>
  <text x="799" y="203" font-size="13.5" fill="#075985" text-anchor="middle">Parallel, each over</text>
  <text x="799" y="221" font-size="13.5" fill="#075985" text-anchor="middle">its own pillar</text>

  <rect x="928" y="144" width="186" height="96" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1021" y="178" font-size="16" font-weight="700" fill="#4c1d95" text-anchor="middle">Verifier</text>
  <text x="1021" y="203" font-size="13.5" fill="#5b21b6" text-anchor="middle">Drops claims the</text>
  <text x="1021" y="221" font-size="13.5" fill="#5b21b6" text-anchor="middle">diagram cannot support</text>

  <line x1="228" y1="192" x2="258" y2="192" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="450" y1="192" x2="480" y2="192" stroke="#d97706" stroke-width="2.5" marker-end="url(#aAmber)"/>
  <line x1="672" y1="192" x2="702" y2="192" stroke="#d97706" stroke-width="2.5" marker-end="url(#aAmber)"/>
  <line x1="894" y1="192" x2="924" y2="192" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- ===== AWS services ===== -->
  <text x="40" y="294" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1.2">WHAT RUNS IT</text>

  <rect x="40" y="310" width="408" height="92" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="62" y="338" font-size="14.5" font-weight="700" fill="#334155">API Gateway → Lambda</text>
  <text x="62" y="361" font-size="12.5" fill="#64748b">HTTP API in front of a Python 3.13 function, arm64, 1536 MB.</text>
  <text x="62" y="380" font-size="12.5" fill="#64748b">Serves the API, the review UI and this talk. Nothing runs at idle.</text>

  <rect x="470" y="310" width="300" height="92" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="492" y="338" font-size="14.5" font-weight="700" fill="#334155">Bedrock</text>
  <text x="492" y="361" font-size="12.5" fill="#64748b">Nova Lite reads and judges,</text>
  <text x="492" y="380" font-size="12.5" fill="#64748b">Titan Embed searches. Via IAM role.</text>

  <rect x="792" y="310" width="322" height="92" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="814" y="338" font-size="14.5" font-weight="700" fill="#334155">S3 · DynamoDB · CloudWatch</text>
  <text x="814" y="361" font-size="12.5" fill="#64748b">Index and uploads, no public access.</text>
  <text x="814" y="380" font-size="12.5" fill="#64748b">Review state with a 24 h TTL. Logs kept 14 days.</text>

  <!-- ===== The gate as a request boundary ===== -->
  <text x="40" y="450" font-size="12" font-weight="700" fill="#b45309" letter-spacing="1.2">THE GATE IS A REQUEST BOUNDARY — STATE LIVES IN DYNAMODB</text>

  <rect x="40" y="466" width="1074" height="70" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>

  <rect x="62" y="484" width="318" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="221" y="501" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">POST /extract</text>
  <text x="221" y="515" font-size="11.5" fill="#64748b" text-anchor="middle">writes the graph as status: pending</text>

  <rect x="400" y="484" width="318" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="559" y="501" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">the reviewer edits it</text>
  <text x="559" y="515" font-size="11.5" fill="#92400e" text-anchor="middle">status: confirmed</text>

  <rect x="738" y="484" width="354" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="915" y="501" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">POST /review</text>
  <text x="915" y="515" font-size="11.5" fill="#64748b" text-anchor="middle">refuses to run unless the graph is confirmed</text>

  <line x1="382" y1="502" x2="396" y2="502" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="720" y1="502" x2="734" y2="502" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- ===== Why ===== -->
  <rect x="40" y="564" width="1074" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="62" y="592" font-size="14.5" font-weight="700" fill="#0f172a">Why the human sits there</text>
  <text x="62" y="618" font-size="13" fill="#475569">The vision model reads labels reliably and invents connections. Measured: up to 98% of reported edges do not exist in the image,</text>
  <text x="62" y="638" font-size="13" fill="#475569">while self-reported confidence stays at 0.95. A pipeline that trusts that graph reviews an architecture that is not there.</text>
  <text x="62" y="660" font-size="13" font-weight="700" fill="#0f172a">So the human sits where the model is provably weak — not as a rubber stamp at the end.</text>
</svg>

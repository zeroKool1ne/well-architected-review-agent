<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="820" fill="#ffffff"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="27" font-weight="700" fill="#0f172a">Agent topology</text>
  <text x="40" y="76" font-size="16" fill="#475569">A supervisor routes between specialists. Models judge — code decides what runs.</text>

  <!-- SUPERVISOR -->
  <rect x="370" y="104" width="460" height="74" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="132" font-size="17" font-weight="700" fill="#4c1d95" text-anchor="middle">SUPERVISOR</text>
  <text x="600" y="156" font-size="13" fill="#5b21b6" text-anchor="middle">Dispatches, merges, deduplicates, ranks by severity</text>

  <line x1="600" y1="182" x2="600" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- EXTRACTION, two passes -->
  <rect x="330" y="214" width="540" height="112" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="600" y="242" font-size="16" font-weight="700" fill="#0c4a6e" text-anchor="middle">EXTRACTION AGENT — two passes, not one</text>
  <text x="600" y="263" font-size="12.5" fill="#075985" text-anchor="middle">Asking for boxes and arrows together let the easy task carry the hard one</text>

  <rect x="356" y="276" width="236" height="36" rx="5" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="474" y="293" font-size="12.5" font-weight="700" fill="#0c4a6e" text-anchor="middle">1 · extract_nodes</text>
  <text x="474" y="307" font-size="11" fill="#0369a1" text-anchor="middle">boxes only — reliable</text>

  <rect x="608" y="276" width="236" height="36" rx="5" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="726" y="293" font-size="12.5" font-weight="700" fill="#0c4a6e" text-anchor="middle">2 · extract_edges</text>
  <text x="726" y="307" font-size="11" fill="#0369a1" text-anchor="middle">arrows, "none" allowed</text>

  <line x1="600" y1="330" x2="600" y2="356" stroke="#d97706" stroke-width="2.5" marker-end="url(#aAmber)"/>

  <!-- HUMAN GATE -->
  <rect x="200" y="360" width="800" height="74" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="600" y="388" font-size="16" font-weight="700" fill="#78350f" text-anchor="middle">HUMAN GATE — a request boundary, not a callback</text>
  <text x="600" y="411" font-size="13" fill="#78350f" text-anchor="middle">The graph waits in DynamoDB as pending. Phase 2 refuses to start until it says confirmed.</text>

  <!-- fan-out -->
  <line x1="600" y1="438" x2="600" y2="456" stroke="#94a3b8" stroke-width="2"/>
  <line x1="208" y1="456" x2="992" y2="456" stroke="#94a3b8" stroke-width="2"/>
  <line x1="208" y1="456" x2="208" y2="480" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="456" x2="600" y2="480" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="992" y1="456" x2="992" y2="480" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="1016" y="452" font-size="12" font-style="italic" fill="#64748b">in parallel</text>

  <!-- PILLAR AGENTS -->
  <rect x="40" y="484" width="336" height="112" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="208" y="512" font-size="15" font-weight="700" fill="#0c4a6e" text-anchor="middle">SECURITY</text>
  <text x="208" y="534" font-size="12" fill="#075985" text-anchor="middle">Public access, IAM scope,</text>
  <text x="208" y="551" font-size="12" fill="#075985" text-anchor="middle">encryption, secrets</text>
  <rect x="66" y="562" width="284" height="26" rx="5" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="208" y="579" font-size="11.5" font-weight="600" fill="#0c4a6e" text-anchor="middle">search_pillars(pillar="security")</text>

  <rect x="432" y="484" width="336" height="112" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="600" y="512" font-size="15" font-weight="700" fill="#0c4a6e" text-anchor="middle">COST OPTIMIZATION</text>
  <text x="600" y="534" font-size="12" fill="#075985" text-anchor="middle">Always-on compute, idle</text>
  <text x="600" y="551" font-size="12" fill="#075985" text-anchor="middle">resources, storage tiers</text>
  <rect x="458" y="562" width="284" height="26" rx="5" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="600" y="579" font-size="11.5" font-weight="600" fill="#0c4a6e" text-anchor="middle">search_pillars(pillar="cost")</text>

  <rect x="824" y="484" width="336" height="112" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="992" y="512" font-size="15" font-weight="700" fill="#0c4a6e" text-anchor="middle">RELIABILITY</text>
  <text x="992" y="534" font-size="12" fill="#075985" text-anchor="middle">Single points of failure,</text>
  <text x="992" y="551" font-size="12" fill="#075985" text-anchor="middle">backups, decoupling</text>
  <rect x="850" y="562" width="284" height="26" rx="5" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="992" y="579" font-size="11.5" font-weight="600" fill="#0c4a6e" text-anchor="middle">search_pillars(pillar="reliability")</text>

  <!-- factory note -->
  <rect x="40" y="608" width="1120" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="600" y="623" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">One agent factory, three instances — same code, different system prompt, different metadata filter on retrieval.</text>
  <text x="600" y="637" font-size="11.5" fill="#64748b" text-anchor="middle">A specialist whose closest passage sits beyond 0.75 cosine distance reports nothing rather than constructing a finding.</text>

  <!-- back together -->
  <line x1="208" y1="650" x2="208" y2="664" stroke="#94a3b8" stroke-width="2"/>
  <line x1="992" y1="650" x2="992" y2="664" stroke="#94a3b8" stroke-width="2"/>
  <line x1="208" y1="664" x2="992" y2="664" stroke="#94a3b8" stroke-width="2"/>
  <line x1="600" y1="664" x2="600" y2="686" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- VERIFIER -->
  <rect x="280" y="690" width="640" height="76" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="600" y="716" font-size="16" font-weight="700" fill="#4c1d95" text-anchor="middle">VERIFIER — can only judge, never propose</text>
  <text x="600" y="738" font-size="12.5" fill="#5b21b6" text-anchor="middle">Receives the graph and the claims, returns keep or drop. Nothing else.</text>
  <text x="600" y="756" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="middle">Instructing the reviewer not to infer from silence did not work. Removing the incentive did.</text>

  <line x1="600" y1="770" x2="600" y2="788" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="600" y="806" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Findings — each one citing the passage it came from</text>
</svg>

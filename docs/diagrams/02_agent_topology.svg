<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="860" fill="#ffffff"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">Agent topology</text>
  <text x="40" y="72" font-size="15" fill="#475569">A supervisor routes between a specialist extractor and three pillar specialists — not a fixed chain</text>

  <!-- SUPERVISOR -->
  <rect x="340" y="104" width="520" height="92" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="134" font-size="17" font-weight="700" fill="#4c1d95" text-anchor="middle">SUPERVISOR</text>
  <text x="600" y="158" font-size="12.5" fill="#5b21b6" text-anchor="middle">Decides what runs next, dispatches to the specialists,</text>
  <text x="600" y="176" font-size="12.5" fill="#5b21b6" text-anchor="middle">merges their findings and ranks them by severity</text>

  <line x1="600" y1="200" x2="600" y2="234" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- EXTRACTION AGENT -->
  <rect x="340" y="238" width="520" height="104" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="600" y="266" font-size="16" font-weight="700" fill="#0c4a6e" text-anchor="middle">EXTRACTION AGENT</text>
  <text x="600" y="288" font-size="12.5" fill="#075985" text-anchor="middle">Turns the image into a graph of services and connections</text>

  <rect x="368" y="300" width="222" height="30" rx="5" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="479" y="320" font-size="12" font-weight="600" fill="#0c4a6e" text-anchor="middle">read_diagram</text>

  <rect x="610" y="300" width="222" height="30" rx="5" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="721" y="320" font-size="12" font-weight="600" fill="#78350f" text-anchor="middle">request_human_review</text>

  <line x1="600" y1="346" x2="600" y2="378" stroke="#d97706" stroke-width="2.5" marker-end="url(#aAmber)"/>

  <!-- HUMAN GATE -->
  <rect x="200" y="382" width="800" height="76" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="600" y="410" font-size="16" font-weight="700" fill="#78350f" text-anchor="middle">HUMAN GATE — a request boundary, not a callback</text>
  <text x="600" y="432" font-size="12.5" fill="#78350f" text-anchor="middle">The graph is written to DynamoDB as pending. A reviewer corrects it in the UI.</text>
  <text x="600" y="450" font-size="12.5" fill="#78350f" text-anchor="middle">Phase 2 refuses to start until the record says confirmed.</text>

  <!-- fan-out lines -->
  <line x1="600" y1="462" x2="600" y2="482" stroke="#94a3b8" stroke-width="2"/>
  <line x1="220" y1="482" x2="980" y2="482" stroke="#94a3b8" stroke-width="2"/>
  <line x1="220" y1="482" x2="220" y2="506" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="482" x2="600" y2="506" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="980" y1="482" x2="980" y2="506" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <text x="1010" y="478" font-size="11.5" font-style="italic" fill="#64748b">run in parallel</text>

  <!-- PILLAR AGENTS -->
  <rect x="50" y="510" width="340" height="128" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="220" y="538" font-size="15" font-weight="700" fill="#0c4a6e" text-anchor="middle">SECURITY</text>
  <text x="220" y="560" font-size="12" fill="#075985" text-anchor="middle">Public buckets, IAM scope,</text>
  <text x="220" y="577" font-size="12" fill="#075985" text-anchor="middle">encryption, secrets handling</text>
  <rect x="78" y="592" width="284" height="30" rx="5" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="220" y="612" font-size="11.5" font-weight="600" fill="#0c4a6e" text-anchor="middle">search_pillars(pillar="security")</text>

  <rect x="430" y="510" width="340" height="128" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="600" y="538" font-size="15" font-weight="700" fill="#0c4a6e" text-anchor="middle">COST OPTIMIZATION</text>
  <text x="600" y="560" font-size="12" fill="#075985" text-anchor="middle">Always-on compute, oversized</text>
  <text x="600" y="577" font-size="12" fill="#075985" text-anchor="middle">storage tiers, idle resources</text>
  <rect x="458" y="592" width="284" height="30" rx="5" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="600" y="612" font-size="11.5" font-weight="600" fill="#0c4a6e" text-anchor="middle">search_pillars(pillar="cost")</text>

  <rect x="810" y="510" width="340" height="128" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="980" y="538" font-size="15" font-weight="700" fill="#0c4a6e" text-anchor="middle">RELIABILITY</text>
  <text x="980" y="560" font-size="12" fill="#075985" text-anchor="middle">Single points of failure,</text>
  <text x="980" y="577" font-size="12" fill="#075985" text-anchor="middle">retries, decoupling, backups</text>
  <rect x="838" y="592" width="284" height="30" rx="5" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="980" y="612" font-size="11.5" font-weight="600" fill="#0c4a6e" text-anchor="middle">search_pillars(pillar="reliability")</text>

  <!-- same code note -->
  <rect x="50" y="652" width="1100" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="600" y="669" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">One agent factory, three instances — same code, different system prompt and a different metadata filter on retrieval.</text>
  <text x="600" y="685" font-size="12" fill="#64748b" text-anchor="middle">The pattern scales to all six pillars; three were run to keep latency and cost in budget, and because the eval set has ground truth for these three.</text>

  <!-- back to supervisor -->
  <line x1="220" y1="700" x2="220" y2="716" stroke="#94a3b8" stroke-width="2"/>
  <line x1="980" y1="700" x2="980" y2="716" stroke="#94a3b8" stroke-width="2"/>
  <line x1="220" y1="716" x2="980" y2="716" stroke="#94a3b8" stroke-width="2"/>
  <line x1="600" y1="716" x2="600" y2="740" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="340" y="744" width="520" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="600" y="768" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">SUPERVISOR merges and ranks → findings</text>
  <text x="600" y="788" font-size="12" fill="#5b21b6" text-anchor="middle">Deduplicated across pillars, each finding carrying the passage it came from</text>

  <!-- LangSmith band -->
  <rect x="40" y="816" width="1120" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="600" y="836" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">LangSmith traces every agent call end to end — and runs the evaluation suite against both baselines</text>
</svg>
